<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hesam Khakbaz | Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;padding:0;box-sizing:border-box}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
::selection{background:transparent}
html.lenis{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}

:root{
  --bg:#E7E7E7;
  --blue:rgb(10,80,180);
  --blue-mid:#1488fc;
  --blue-hi:#64acf6;
  --blue-glow:rgba(20,136,252,.4);
  --red:#e0115f;
  --glass:rgba(255,255,255,.32);
  --dark:#1c1c1c;
}
html[data-color="red"]{--blue:rgb(142,22,0);--blue-mid:#e0115f;--blue-hi:#e86a7a;--blue-glow:rgba(224,17,95,.45)}
html[data-color="black"]{--blue:#2c2c2e;--blue-mid:#48484c;--blue-hi:#78787e;--blue-glow:rgba(0,0,0,.25)}

body{background:var(--bg);font-family:'JetBrains Mono',Vazirmatn,system-ui,sans-serif;overflow-x:hidden;color:var(--dark)}
html[dir="rtl"] body{font-family:Vazirmatn,'JetBrains Mono',system-ui,sans-serif}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.05);border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--blue-mid);border-radius:10px}

/* ═══ نوار پیشرفت — شیمر همرنگِ تم + هالهٔ نور از نوک ═══ */
.sbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:3000;pointer-events:none;background:rgba(0,0,0,.06)}
.sbar i{
  display:block;height:100%;width:0;position:relative;z-index:1;
  background:linear-gradient(90deg,var(--blue) 0%,var(--blue-mid) 35%,var(--blue-hi) 50%,var(--blue-mid) 65%,var(--blue) 100%);
  background-size:200% 100%;
  animation:sbarShine 2.4s ease-in-out infinite;
  border-radius:0 3px 3px 0;
}
.sbar i::after{
  content:'';
  position:absolute;
  left:100%;
  top:0;
  height:100%;
  width:60px;
  background:radial-gradient(ellipse 60px 14px at 0% 50%,var(--blue-glow) 0%,transparent 70%);
  pointer-events:none;
  filter:blur(2px);
}
@keyframes sbarShine{0%{background-position:0 0}50%{background-position:100% 0}100%{background-position:0 0}}

/* ═══ لودر اول — فقط گوی، ۶ ثانیه ═══ */
.page-loader{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease,visibility .7s}
.page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}

/* ═══ لودر دوم — اسکلتون سنگین (خالص) ═══ */
.swap-loader{position:fixed;inset:0;z-index:9500;overflow-y:auto;
  background:rgba(231,231,231,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;
  display:flex;justify-content:center;padding:40px 20px}
.swap-loader.on{opacity:1;visibility:visible}
.sl-wrap{max-width:820px;width:100%;display:flex;flex-direction:column;gap:22px}
.skeleton{position:relative;overflow:hidden;background:#e2e6ed!important;border-radius:10px}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.65) 50%,transparent 100%);transform:translateX(-100%);animation:shimmer 1.8s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sl-search{width:100%;height:52px;border-radius:16px}
.sl-banner{width:100%;height:170px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--blue-mid))!important}
.sl-profile{display:flex;align-items:center;gap:20px;padding:5px 0}
.sl-avatar{width:76px;height:76px;border-radius:50%;flex-shrink:0}
.sl-info{flex:1;display:flex;flex-direction:column;gap:10px}
.sl-name{height:26px;width:55%}
.sl-bio{height:17px;width:80%}
.sl-tabs{display:flex;gap:14px;flex-wrap:wrap}
.sl-tab{height:38px;width:88px;border-radius:30px}
.sl-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sl-stat{background:#fff;padding:16px 8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.sl-num{height:26px;width:60%;border-radius:6px}
.sl-cap{height:15px;width:70%;border-radius:4px}
.sl-feed{display:flex;flex-direction:column;gap:16px}
.sl-feeditem{display:flex;gap:16px;align-items:flex-start;background:#fff;padding:16px 18px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
html[dir="rtl"] .sl-feeditem{flex-direction:row}
.sl-thumb{width:70px;height:70px;border-radius:16px;flex-shrink:0}
.sl-fc{flex:1;display:flex;flex-direction:column;gap:8px}
.sl-title{height:20px;width:70%;border-radius:6px}
.sl-desc{height:14px;width:100%;border-radius:4px}
.sl-desc.short{width:45%}
@media(max-width:700px){.sl-stats{grid-template-columns:repeat(3,1fr)}.sl-banner{height:120px}}
@media(max-width:500px){.sl-stats{grid-template-columns:repeat(2,1fr)}.sl-avatar{width:60px;height:60px}.sl-profile{gap:14px}.sl-feeditem{flex-direction:column;align-items:center;text-align:center}.sl-thumb{width:100%;height:120px}.sl-title,.sl-desc{width:90%}}

/* ═══ خود لودر — رنگ اصلی دست‌نخورده ═══ */
.loader{
  --color-one:#ffbf48;--color-two:#be4a1d;--color-three:#ffbf4780;--color-four:#bf4a1d80;--color-five:#ffbf4740;
  --time-animation:2s;--size:1;
  position:relative;border-radius:50%;transform:scale(var(--size));
  box-shadow:0 0 25px 0 var(--color-three),0 20px 50px 0 var(--color-four);
  animation:colorize calc(var(--time-animation)*3) ease-in-out infinite;
}
.loader::before{content:"";position:absolute;top:0;left:0;width:100px;height:100px;border-radius:50%;border-top:solid 1px var(--color-one);border-bottom:solid 1px var(--color-two);background:linear-gradient(180deg,var(--color-five),var(--color-four));box-shadow:inset 0 10px 10px 0 var(--color-three),inset 0 -10px 10px 0 var(--color-four)}
.loader .box{width:100px;height:100px;background:linear-gradient(180deg,var(--color-one) 30%,var(--color-two) 70%);mask:url(#clipping);-webkit-mask:url(#clipping)}
.loader svg{position:absolute}
.loader svg #clipping{filter:contrast(15);animation:roundness calc(var(--time-animation)/2) linear infinite}
.loader svg #clipping polygon{filter:blur(7px)}
.loader svg #clipping polygon:nth-child(1){transform-origin:75% 25%;transform:rotate(90deg)}
.loader svg #clipping polygon:nth-child(2){transform-origin:50% 50%;animation:rotation var(--time-animation) linear infinite reverse}
.loader svg #clipping polygon:nth-child(3){transform-origin:50% 60%;animation:rotation var(--time-animation) linear infinite;animation-delay:calc(var(--time-animation)/-3)}
.loader svg #clipping polygon:nth-child(4){transform-origin:40% 40%;animation:rotation var(--time-animation) linear infinite reverse}
.loader svg #clipping polygon:nth-child(5){transform-origin:40% 40%;animation:rotation var(--time-animation) linear infinite reverse;animation-delay:calc(var(--time-animation)/-2)}
.loader svg #clipping polygon:nth-child(6){transform-origin:60% 40%;animation:rotation var(--time-animation) linear infinite}
.loader svg #clipping polygon:nth-child(7){transform-origin:60% 40%;animation:rotation var(--time-animation) linear infinite;animation-delay:calc(var(--time-animation)/-1.5)}
@keyframes rotation{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes roundness{0%{filter:contrast(15)}20%{filter:contrast(3)}40%{filter:contrast(3)}60%{filter:contrast(15)}100%{filter:contrast(15)}}
@keyframes colorize{0%{filter:hue-rotate(0deg)}20%{filter:hue-rotate(-30deg)}40%{filter:hue-rotate(-60deg)}60%{filter:hue-rotate(-90deg)}80%{filter:hue-rotate(-45deg)}100%{filter:hue-rotate(0deg)}}

/* ── هدر شیشه‌ای ── */
.glass-header{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:60px;padding:8px 20px;z-index:1000;display:flex;align-items:center;justify-content:center;gap:15px;border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.glass-header a{font-size:.85rem;font-weight:600;color:var(--dark);text-decoration:none;padding:6px 16px;border-radius:40px;transition:all .2s;white-space:nowrap}
.glass-header a:hover{background:rgba(0,0,0,.06)}
.menu-star{width:50px;height:50px;background:var(--blue);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;margin:-10px 0;box-shadow:0 4px 14px rgba(0,0,0,.25),0 0 22px var(--blue-glow)}
.menu-star:hover{transform:scale(1.06) rotate(-10deg);border-radius:20px;box-shadow:0 4px 22px var(--blue-glow)}
.menu-star i{font-size:1.5rem;color:#cfe7ff;filter:drop-shadow(0 0 8px var(--blue-mid))}
.nav-popup{position:fixed;bottom:95px;left:50%;transform:translateX(-50%) scale(.95);background:rgba(255,255,255,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:60px;padding:18px 28px;z-index:999;opacity:0;visibility:hidden;transition:all .35s cubic-bezier(.34,1.2,.64,1);border:1px solid rgba(255,255,255,.4);box-shadow:0 20px 40px rgba(0,0,0,.2)}
.nav-popup.open{transform:translateX(-50%) scale(1);opacity:1;visibility:visible}
.nav-popup-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.nav-popup-links a{font-size:.85rem;font-weight:600;color:var(--dark);text-decoration:none;padding:10px 22px;border-radius:50px;background:rgba(255,255,255,.25);transition:all .25s;white-space:nowrap;border:1px solid rgba(255,255,255,.3)}
.nav-popup-links a:hover{background:var(--blue);color:var(--bg);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* ── صفحات ── */
.page{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.page-first{background:var(--bg)}
.top-thin-line{position:absolute;top:1%;left:1%;width:98%;height:1px;background:var(--dark);opacity:.3;z-index:20}

/* ═══ سوییچر سه‌مربع — همیشه LTR ═══ */
.squares-horizontal{position:absolute;top:32px;left:28px;display:flex;z-index:20;direction:ltr!important}
.half-square{width:28px;height:28px;border-radius:10px;cursor:pointer;position:relative;transition:transform .3s cubic-bezier(.34,1.2,.64,1),box-shadow .3s}
.half-square:hover{transform:scale(1.15) rotate(-8deg)}
.half-square:active{transform:scale(.95)}
.sq-dark{background:#1c1c1c}
.sq-blue{background:#1488fc;margin-left:-14px;box-shadow:0 0 15px rgba(20,136,252,.5)}
.sq-red{background:#e0115f;margin-left:-14px;box-shadow:0 0 15px rgba(224,17,95,.5)}
.half-square.active{transform:scale(1.1)}

.date-outside{position:absolute;top:32px;right:28px;font-size:.85rem;background:rgba(0,0,0,.05);padding:6px 14px;border-radius:40px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20}
.portfolio-wrapper{display:flex;flex-direction:column;align-items:center;gap:25px;position:relative;z-index:10}
.top-shape{width:400px;height:60px;background:linear-gradient(90deg,var(--blue),var(--blue-mid));border-radius:30px 30px 0 0;box-shadow:0 0 40px var(--blue-glow)}
.portfolio-row{display:flex;align-items:center;gap:30px;white-space:nowrap}
.portfolio-shape{width:80px;height:12px;background:var(--blue);border-radius:8px}
.portfolio-text{font-size:10vw;font-weight:800;line-height:1.1;filter:blur(24px);opacity:0;letter-spacing:.3em;animation:heroIn 1.6s .3s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes heroIn{to{filter:blur(0);opacity:1;letter-spacing:.04em}}
.bottom-container{display:flex;align-items:center;justify-content:center;gap:12px;font-size:.85rem;background:rgba(0,0,0,.05);padding:8px 20px;border-radius:40px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap}
.lang-toggle{background:rgba(0,0,0,.06);border:none;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;transition:all .3s}
.lang-toggle:hover{background:var(--blue);color:var(--bg);transform:scale(1.1)}

/* ── مارکی — همیشه LTR ═══ */
.mq{padding:44px 0;overflow:hidden;border-block:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.18);direction:ltr!important}
.mrow{display:flex;direction:ltr!important;width:max-content}
.mrow>.half{display:flex;align-items:center;flex-shrink:0}
.mrow.a{animation:mqA 40s linear infinite}
.mrow.b{margin-top:.5rem;animation:mqB 48s linear infinite}
@keyframes mqA{to{transform:translateX(-50%)}}
@keyframes mqB{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mi{font-size:clamp(1.7rem,4.5vw,3.4rem);font-weight:800;padding-inline:1.5rem;direction:rtl;line-height:1.5;white-space:nowrap;color:#c4cbd6}
.mi.f{background:linear-gradient(110deg,var(--blue),var(--blue-mid));-webkit-background-clip:text;background-clip:text;color:transparent}
.mstar{width:clamp(13px,1.8vw,22px);height:auto;flex-shrink:0;color:var(--blue-mid)}

/* ── صفحه ۲ ── */
.page-second{background:var(--bg)}
.page-second::before{content:'';position:absolute;inset:0;background-image:linear-gradient(to right,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.05) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
.fall-container{position:relative;z-index:2;width:100%;display:flex;justify-content:center}
.second-container{display:flex;align-items:center;justify-content:center;gap:60px;max-width:1200px;width:90%;padding:40px;flex-wrap:wrap}
.photo-shape{width:280px;height:280px;background:linear-gradient(135deg,var(--blue),var(--blue-mid));border-radius:48px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.15),0 0 60px var(--blue-glow);position:relative;overflow:hidden;margin-bottom:30px}
.photo-shape::before{content:'';position:absolute;width:150%;height:150%;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);top:-50%;left:-50%}
.photo-placeholder{font-size:1rem;color:rgba(255,255,255,.92);text-align:center;z-index:2}
.photo-placeholder i{font-size:4rem;display:block;margin-bottom:15px;color:#fff;filter:drop-shadow(0 0 15px var(--blue-glow))}
.about-card{padding:30px 35px;text-align:left;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;width:100%;max-width:520px}
html[dir="rtl"] .about-card{text-align:right}
.about-card h2{font-size:2.4rem;font-weight:800;margin-bottom:18px}
.about-card p{font-size:1rem;line-height:1.8;color:#2c2c2e;margin-bottom:25px}
.about-card .highlight{display:inline-block;background:var(--blue);color:#fff;padding:8px 20px;border-radius:40px;font-size:.85rem;box-shadow:0 0 20px var(--blue-glow)}

/* ── صفحه ۳ ── */
.page-third{background:var(--bg)}
.suck-layer{position:absolute;top:50%;left:50%;width:10px;height:10px;background:var(--blue);border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:50;pointer-events:none}
.about-detail-wrapper{max-width:1200px;width:90%;position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:40px;align-items:stretch;justify-content:center}
.about-detail-container{flex:2;min-width:280px;padding:50px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;text-align:center}
.about-detail-container h2{font-size:2.6rem;font-weight:800;margin-bottom:20px}
.about-detail-container p{font-size:1rem;line-height:1.8;color:#2c2c2e;margin-bottom:18px}
.map-card{flex:1.2;min-width:260px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;padding:30px 25px;text-align:center;border:1px solid rgba(255,255,255,.4);display:flex;flex-direction:column;justify-content:center}
.map-card h3{font-size:1.5rem;font-weight:700;margin-bottom:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.map-card h3 i{color:var(--blue)}
.iran-svg-container{margin:18px 0;display:flex;justify-content:center}
.iran-svg-container svg{max-width:190px;width:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12));transition:transform .3s}
.iran-svg-container svg:hover{transform:scale(1.03)}
#iranMain{fill:var(--blue)}
#iranProv{fill:var(--blue-mid)}
.iran-map-text{margin-top:18px;font-size:.85rem;background:rgba(0,0,0,.05);padding:8px 14px;border-radius:40px;display:inline-block}
.city-badge{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.city-badge span{background:rgba(0,0,0,.08);padding:5px 14px;border-radius:30px;font-size:.72rem;font-weight:600}
.info-rows-container{margin-top:26px;text-align:left}
html[dir="rtl"] .info-rows-container{text-align:right}
.info-row-modern{display:flex;align-items:center;gap:18px;padding:15px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.info-row-modern:last-child{border-bottom:none}
.info-icon-modern{width:52px;height:52px;background:rgba(0,0,0,.07);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--blue);flex-shrink:0}
.info-content{flex:1;text-align:left}
html[dir="rtl"] .info-content{text-align:right}
.info-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6c6c70;margin-bottom:4px}
.info-value{font-weight:700;font-size:1.05rem}

/* ── پین محصولی ── */
.ss11{height:420vh;position:relative}
.ss11-pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:0 24px;overflow:hidden;background:var(--bg)}
.ss11-stage{position:relative;width:min(920px,94vw);height:min(540px,70svh);border-radius:60px;overflow:hidden;background:linear-gradient(150deg,var(--blue-mid),var(--blue) 55%,#0a1420);box-shadow:0 44px 120px rgba(0,0,0,.4)}
.ss11-frame{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(2rem,6vw,4rem);opacity:0;will-change:transform,opacity,filter}
.ss11-frame h3{font-size:clamp(1.7rem,4.8vw,3.4rem);font-weight:800;line-height:1.6;color:#fff}
.ss11-frame h3 em{font-style:normal;color:#cfe7ff}
.ss11-frame p{color:rgba(255,255,255,.8);margin-top:1rem;font-size:clamp(.9rem,2vw,1.08rem);max-width:42ch}
.ss11-num{position:absolute;top:clamp(1.2rem,3vw,2rem);left:clamp(1.4rem,3.5vw,2.4rem);font-size:.8rem;color:rgba(255,255,255,.6);direction:ltr;z-index:2}
.ss11-gem{position:absolute;bottom:clamp(1.2rem,3vw,2rem);right:clamp(1.4rem,3.5vw,2.4rem);color:#fff;font-size:1.3rem;filter:drop-shadow(0 0 10px var(--blue-glow));z-index:2}
.ss11-meta{display:flex;align-items:center;gap:1rem}
.ss11-dots{display:flex;gap:.55rem}
.ss11-dots i{width:8px;height:8px;border-radius:50%;background:#c9cdd3;transition:background .3s,transform .3s}
.ss11-dots i.on{background:var(--blue);transform:scale(1.25)}
.ss11-hint{color:#6c6c70;font-size:.78rem}

/* ── مهارت‌ها ── */
.page-skills{background:var(--bg);min-height:100vh;padding:80px 24px}
.skills-container{max-width:1300px;margin:0 auto}
.badge-center{text-align:center;margin-bottom:20px}
.skills-badge{display:inline-block;background:rgba(0,0,0,.08);padding:6px 18px;border-radius:40px;font-size:.8rem;font-weight:700;letter-spacing:1px;color:var(--blue)}
.skills-description{text-align:center;margin-bottom:50px}
.skills-description p{font-size:1rem;color:#4a4a4e;max-width:600px;margin:0 auto;background:rgba(255,255,255,.25);padding:12px 24px;border-radius:50px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.interests-section{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;padding:40px 30px;text-align:center;margin-bottom:50px}
.interests-title{font-size:1.5rem;font-weight:700;margin-bottom:28px;display:flex;align-items:center;justify-content:center;gap:10px}
.interests-title i{color:var(--blue)}
.interests-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.interest-item{background:rgba(0,0,0,.05);padding:10px 22px;border-radius:40px;font-size:.95rem;font-weight:600;transition:.25s;cursor:default}
.interest-item:hover{background:var(--blue);color:#fff;transform:translateY(-3px);box-shadow:0 0 20px var(--blue-glow)}
.interest-item i{margin-right:8px}
html[dir="rtl"] .interest-item i{margin-right:0;margin-left:8px}
.skills-grid-modern{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-bottom:50px}
.skill-category-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:48px;padding:28px 24px;transition:all .3s;border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 20px rgba(0,0,0,.05)}
.skill-category-card:hover{transform:translateY(-5px);background:rgba(255,255,255,.45);border-color:var(--blue-mid);box-shadow:0 8px 30px rgba(0,0,0,.1)}
.category-title{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid var(--blue-mid)}
.category-title i{font-size:1.8rem;color:var(--blue)}
.category-title h3{font-size:1.4rem;font-weight:800}
.skill-list{display:flex;flex-direction:column;gap:18px}
.skill-row{display:flex;flex-direction:column;gap:8px}
.skill-info{display:flex;justify-content:space-between;font-weight:600;color:#2c2c2e;font-size:.92rem}
.skill-name{display:flex;align-items:center;gap:8px}
.skill-name i{color:var(--blue);width:20px;text-align:center}
.skill-percent{font-size:.75rem;background:rgba(0,0,0,.05);padding:2px 8px;border-radius:20px}
.progress-bar-container{width:100%;height:8px;background:rgba(0,0,0,.1);border-radius:10px;overflow:hidden}
.progress-fill{width:0%;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-mid));border-radius:10px;transition:width 1.2s cubic-bezier(.22,.97,.36,1);box-shadow:0 0 10px var(--blue-glow)}
.vertical-bars-section{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;padding:40px 30px;text-align:center}
.vertical-bars-title{font-size:1.5rem;font-weight:700;margin-bottom:28px}
.vertical-bars-title i{color:var(--blue);margin-right:10px}
html[dir="rtl"] .vertical-bars-title i{margin-right:0;margin-left:10px}
.bars-container{display:flex;justify-content:center;align-items:flex-end;gap:34px;flex-wrap:wrap}
.bar-item{display:flex;flex-direction:column;align-items:center;gap:10px}
.vertical-bar{width:76px;height:190px;background:rgba(0,0,0,.14);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bar-fill{width:100%;background:linear-gradient(to top,var(--blue),var(--blue-mid));border-radius:40px;height:0%;transition:height 1.2s cubic-bezier(.22,.97,.36,1)}
.bar-label{font-weight:700;font-size:.85rem}
.bar-value{font-size:.75rem;color:var(--blue);font-weight:800}

/* ── پروژه‌ها ── */
.page-projects{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px}
.projects-container{max-width:1050px;width:100%;padding:50px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px;text-align:center}
.projects-container h2{font-size:2.6rem;font-weight:800;margin-bottom:16px}
.coming-soon-badge{background:var(--blue);color:#fff;padding:8px 24px;border-radius:40px;display:inline-block;margin-bottom:36px;font-size:.85rem}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.project-card{display:block;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:32px;padding:36px 18px;text-decoration:none;color:var(--dark);transition:.3s;position:relative}
.project-card:hover{transform:translateY(-10px);background:rgba(255,255,255,.8);box-shadow:0 20px 40px rgba(0,0,0,.18)}
.project-icon{font-size:2.6rem;margin-bottom:16px}
.project-card h3{font-size:1.15rem;margin-bottom:8px;font-weight:800}
.project-card p{font-size:.82rem;color:#4a4a4e;line-height:1.7}
.live-badge{position:absolute;top:14px;left:14px;background:var(--blue);color:#fff;font-size:.6rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:1px}
.live-badge::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#7dff9a;margin-right:4px;box-shadow:0 0 6px #7dff9a}
.soon-card{cursor:default;border:2px dashed var(--blue-mid);background:transparent}
.soon-card:hover{transform:none;box-shadow:none;background:transparent}

/* ── FAQ ── */
.page-faq{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px}
.faq-container{max-width:820px;width:100%;padding:50px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px}
.faq-container h2{font-size:2.4rem;font-weight:800;margin-bottom:36px;text-align:center}
.faq-item{margin-bottom:12px;border-bottom:1px solid rgba(0,0,0,.1)}
.faq-question{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;font-weight:700;font-size:.98rem}
.faq-question i{color:var(--blue);transition:transform .3s;flex-shrink:0}
.faq-item.active .faq-question i{transform:rotate(180deg)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 20px;font-size:.92rem;color:#3a3a3e;line-height:1.9}
.faq-item.active .faq-answer{max-height:300px;padding:0 20px 18px 20px}
.faq-answer code{background:rgba(0,0,0,.08);color:var(--blue);border-radius:6px;padding:.1em .5em;font-size:.82rem;direction:ltr;display:inline-block}

/* ── چت ── */
.chat-sec{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;gap:clamp(2rem,6vw,5rem);flex-wrap:wrap;padding:80px 24px;perspective:1200px}
.chat-info{max-width:360px;text-align:center}
.chat-info h2{font-size:2.4rem;font-weight:800;margin-bottom:14px}
.chat-info p{color:#4a4a4e;line-height:1.9;font-size:.98rem}
.chat-info .pill{display:inline-block;background:rgba(0,0,0,.08);color:var(--blue);padding:6px 18px;border-radius:40px;font-size:.75rem;font-weight:700;margin-bottom:16px}
.dev-wrap{will-change:transform}
.phone{width:min(340px,90vw);border-radius:54px;background:#0b0b0c;border:1px solid #3a3a3c;padding:11px;box-shadow:0 50px 110px rgba(0,0,0,.35);position:relative}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#0b0b0c;border-radius:999px;z-index:5}
.screen{width:100%;height:600px;border-radius:44px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.chead{display:flex;align-items:center;gap:.7rem;padding:52px 16px 12px;border-bottom:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.95)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--blue-mid));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chead .nm{font-weight:800;font-size:.9rem;line-height:1.4}
.chead .st{font-size:.66rem;color:#30a158;font-weight:600}
.cmsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#fafafa,#f0f0f2)}
.cmsgs::-webkit-scrollbar{width:5px}
.cmsgs::-webkit-scrollbar-thumb{background:#d0d0d3;border-radius:4px}
.mb{max-width:82%;padding:.6em 1.05em;border-radius:19px;font-size:.85rem;line-height:1.85;color:#1a1a1a;animation:pop .35s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1}}
.mb.u{align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:19px 19px 19px 6px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.mb.m{align-self:flex-end;background:linear-gradient(160deg,var(--blue-mid),var(--blue));color:#fff;border-radius:19px 19px 6px 19px}
.mb.tp{display:flex;gap:4px;padding:1em 1.2em}
.mb.tp i{width:6px;height:6px;border-radius:50%;background:#c9c9cb;animation:tp 1s infinite}
.mb.tp i:nth-child(2){animation-delay:.15s}
.mb.tp i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;padding:8px 12px;background:#fff;border-top:1px solid rgba(0,0,0,.07)}
.chip{border:1px solid var(--blue-mid);border-radius:999px;padding:.4em 1em;font-size:.72rem;color:var(--blue);background:rgba(0,0,0,.03);font-family:inherit;font-weight:700;cursor:pointer;transition:.25s}
.chip:hover{background:var(--blue);color:#fff}
.cform{display:flex;gap:.5rem;padding:10px 12px;background:#fff}
.cform input{flex:1;background:#f0f0f2;border:1px solid transparent;border-radius:999px;padding:.65em 1.1em;font-family:inherit;font-size:.86rem;outline:none;transition:.3s}
.cform input:focus{background:#fff;border-color:var(--blue-mid)}
.cform button{background:var(--blue);border:none;border-radius:50%;width:38px;height:38px;color:#fff;cursor:pointer;transition:filter .3s;flex-shrink:0}
.cform button:hover{filter:brightness(1.25)}

/* ── تماس ── */
.page-contact{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px}
.contact-master-section{max-width:1300px;width:100%;margin:0 auto}
.contact-header-outside{text-align:center;margin-bottom:36px}
.contact-badge-outside{display:inline-block;background:rgba(0,0,0,.08);padding:6px 18px;border-radius:40px;font-size:.78rem;font-weight:700;letter-spacing:1px;color:var(--blue);margin-bottom:18px}
.contact-header-outside h2{font-size:2.8rem;font-weight:800;margin-bottom:14px}
.contact-header-outside p{font-size:1rem;color:#4a4a4e;max-width:600px;margin:0 auto}
.contact-glass-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:48px;padding:50px 40px;text-align:center;border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 20px rgba(0,0,0,.05)}
.lets-talk-title{font-size:2.8rem;font-weight:800;margin-bottom:14px}
.red-line{width:120px;height:2px;background:var(--blue);margin:0 auto 28px;border-radius:1px;box-shadow:0 0 15px var(--blue-glow)}
.social-icons-wrapper{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-bottom:28px}
.social-icons-wrapper a{color:var(--dark);font-size:1.9rem;transition:.25s;display:inline-block}
.social-icons-wrapper a:hover{transform:translateY(-6px) scale(1.1);color:var(--blue)}
.contact-details{color:#2c2c2e;font-size:1.05rem;line-height:1.8}
.contact-details i{color:var(--blue);margin-right:8px}
html[dir="rtl"] .contact-details i{margin-right:0;margin-left:8px}
.contact-details a{color:inherit;text-decoration:none}
.contact-details a:hover{color:var(--blue)}
.contact-location{margin-top:14px;font-size:.9rem;opacity:.85}
.contact-location i{color:var(--blue);margin-right:6px}
html[dir="rtl"] .contact-location i{margin-right:0;margin-left:6px}
.avail{font-size:.78rem;color:#5a5a5e;margin-top:16px}

/* ── فوتر — همیشه سیاه ═══ */
.footer{background:#1c1c1c;border-radius:40px 40px 0 0;padding:50px 30px 30px;color:#e0e0e0}
.footer-container{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px}
.footer-col{flex:1;min-width:200px}
.footer-col h4{font-size:1.25rem;margin-bottom:20px;color:#fff;position:relative;display:inline-block}
.footer-col h4::after{content:'';position:absolute;bottom:-8px;left:0;width:45px;height:3px;background:var(--blue-mid);border-radius:2px}
html[dir="rtl"] .footer-col h4::after{left:auto;right:0}
.footer-col p{line-height:1.8;font-size:.9rem;opacity:.8;margin-top:12px}
.footer-links{list-style:none}
.footer-links li{margin-bottom:10px}
.footer-links a{color:#e0e0e0;text-decoration:none;font-size:.88rem;transition:.2s;opacity:.85}
.footer-links a:hover{opacity:1;color:var(--blue-mid);padding-left:5px}
html[dir="rtl"] .footer-links a:hover{padding-left:0;padding-right:5px}
.footer-social{text-align:center;margin-top:44px;padding-top:28px;border-top:1px solid rgba(255,255,255,.1)}
.footer-social-title{font-size:.85rem;margin-bottom:16px;opacity:.7;letter-spacing:1px}
.footer-social-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.footer-social-icons a{color:#e0e0e0;font-size:1.5rem;transition:.2s}
.footer-social-icons a:hover{transform:translateY(-3px);color:var(--blue-mid)}
.footer-bottom{text-align:center;padding-top:26px;margin-top:18px;font-size:.78rem;opacity:.6}
.footer-bottom span{color:var(--blue-mid);font-weight:600}

/* ═══ ریسپانسیو ═══ */
@media (max-width:800px){
  .about-detail-wrapper{flex-direction:column}
  .footer-container{flex-direction:column;text-align:center;gap:30px}
  .footer-col h4{display:block;text-align:center}
  .footer-col h4::after{left:50%;transform:translateX(-50%)}
  .footer-links li{text-align:center}
  .skills-grid-modern{grid-template-columns:1fr}
  .vertical-bar{width:52px;height:140px}
  .bars-container{gap:16px}
  .contact-glass-card{padding:35px 20px}
  .contact-header-outside h2,.lets-talk-title{font-size:2rem}
  .about-detail-container,.faq-container,.projects-container{padding:32px 20px;border-radius:40px}
  .photo-shape{width:200px;height:200px;border-radius:36px}
}
@media (max-width:500px){
  .glass-header{padding:8px 14px;gap:10px;bottom:16px;border-radius:50px;background:rgba(255,255,255,.38)}
  .glass-header a{font-size:.68rem;padding:5px 12px}
  .menu-star{width:42px;height:42px;border-radius:14px;margin:-6px 0}
  .menu-star i{font-size:1.15rem}
  .nav-popup{bottom:76px;padding:14px 16px;border-radius:40px;background:rgba(255,255,255,.4)}
  .nav-popup-links{gap:8px}
  .nav-popup-links a{font-size:.68rem;padding:8px 14px}
  .bottom-container{font-size:.62rem;padding:6px 12px;gap:8px}
  .lang-toggle{width:26px;height:26px}
  .portfolio-text{font-size:14vw}
  .top-shape{width:200px;height:36px;border-radius:20px 20px 0 0}
  .portfolio-shape{width:40px;height:8px}
  .portfolio-row{gap:14px}
  .squares-horizontal{top:16px;left:14px}
  .half-square{width:18px;height:18px;border-radius:6px}
  .sq-blue,.sq-red{margin-left:-8px}
  .date-outside{top:16px;right:14px;font-size:.6rem;padding:4px 10px}
  .second-container{gap:16px;padding:16px 10px;width:95%}
  .photo-shape{width:150px;height:150px;border-radius:30px;margin-bottom:8px}
  .photo-placeholder i{font-size:2.2rem;margin-bottom:6px}
  .photo-placeholder{font-size:.75rem}
  .about-card{padding:22px 18px;border-radius:32px;max-width:100%}
  .about-card h2{font-size:1.7rem;margin-bottom:12px}
  .about-card p{font-size:.86rem;margin-bottom:16px}
  .about-card .highlight{font-size:.7rem;padding:6px 16px}
  .about-detail-container{padding:26px 18px;border-radius:36px}
  .about-detail-container h2{font-size:1.9rem}
  .about-detail-container p{font-size:.88rem}
  .map-card{border-radius:36px;padding:22px 16px}
  .map-card h3{font-size:1.15rem}
  .iran-svg-container svg{max-width:130px}
  .info-icon-modern{width:40px;height:40px;font-size:1.05rem;border-radius:20px}
  .info-value{font-size:.88rem}
  .info-label{font-size:.55rem}
  .page-skills{padding:44px 12px}
  .interests-section{padding:24px 14px;border-radius:36px}
  .interests-title,.vertical-bars-title{font-size:1.1rem}
  .interest-item{font-size:.72rem;padding:6px 13px}
  .skill-category-card{padding:18px 14px;border-radius:28px}
  .category-title h3{font-size:1.05rem}
  .category-title i{font-size:1.3rem}
  .skill-info{font-size:.8rem}
  .vertical-bar{width:38px;height:96px;border-radius:24px}
  .bar-label,.bar-value{font-size:.58rem}
  .bars-container{gap:10px}
  .projects-container,.faq-container{padding:24px 16px;border-radius:36px}
  .projects-container h2,.faq-container h2{font-size:1.8rem}
  .faq-question{padding:14px 12px;font-size:.85rem}
  .chat-sec{padding:60px 14px}
  .screen{height:540px}
  .chat-info h2{font-size:1.8rem}
  .chat-info p{font-size:.86rem}
  .page-contact{padding:60px 12px}
  .contact-glass-card{padding:28px 16px;border-radius:36px}
  .lets-talk-title{font-size:1.9rem}
  .red-line{width:80px}
  .social-icons-wrapper{gap:16px}
  .social-icons-wrapper a{font-size:1.4rem}
  .contact-details{font-size:.85rem}
  .footer{padding:32px 16px 20px;border-radius:28px 28px 0 0}
}
@media (max-width:360px){
  .glass-header{gap:6px;padding:7px 10px}
  .glass-header a{font-size:.6rem;padding:4px 9px}
  .menu-star{width:36px;height:36px;border-radius:12px}
  .menu-star i{font-size:.95rem}
  .half-square{width:15px;height:15px;border-radius:5px}
  .sq-blue,.sq-red{margin-left:-7px}
  .portfolio-text{font-size:16vw}
  .about-card h2{font-size:1.45rem}
  .faq-question{font-size:.8rem;padding:12px 10px}
  .lets-talk-title{font-size:1.6rem}
}
@media (min-width:801px) and (max-width:1100px) and (orientation:landscape){
  .second-container{gap:40px}
  .about-card{max-width:440px}
  .about-detail-container{flex:1.4}
  .map-card{flex:1}
}
@media (min-width:2000px){
  body{font-size:18px}
  .glass-header a,.nav-popup-links a{font-size:1rem}
  .menu-star{width:60px;height:60px}
  .menu-star i{font-size:1.8rem}
  .half-square{width:34px;height:34px;border-radius:12px}
  .sq-blue,.sq-red{margin-left:-17px}
  .date-outside{font-size:1rem}
  .portfolio-text{font-size:9vw;max-width:2200px}
  .top-shape{width:480px;height:70px}
  .second-container,.about-detail-wrapper,.projects-container,.faq-container,.skills-container,.contact-master-section{max-width:1500px}
  .about-card{max-width:640px}
  .about-card p,.about-detail-container p,.skills-description p,.chat-info p,.contact-header-outside p{font-size:1.15rem}
  .phone{width:400px}
  .screen{height:680px}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass-header,.nav-popup,.bottom-container,.date-outside,.swap-loader{background:rgba(245,245,247,.94)}
  .skills-description p,.interests-section,.skill-category-card,.map-card,.about-detail-container,.about-card,.projects-container,.faq-container,.contact-glass-card,.chat-info .pill{background:rgba(255,255,255,.75)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .portfolio-text{filter:none;opacity:1;letter-spacing:.04em}
}
</style>
</head>
<body>

<!-- ═══ نوار پیشرفت اسکرول ═══ -->
<div class="sbar" id="sbar"><i id="sbarFill"></i></div>

<!-- ═══ لودر اول — فقط گوی، ۶ ثانیه ═══ -->
<div class="page-loader" id="pageLoader">
  <div class="loader">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <defs>
        <mask id="clipping">
          <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
          <polygon points="25,25 75,25 50,75" fill="white"></polygon>
          <polygon points="50,25 75,75 25,75" fill="white"></polygon>
          <polygon points="35,35 65,35 50,65" fill="white"></polygon>
          <polygon points="35,35 65,35 50,65" fill="white"></polygon>
          <polygon points="35,35 65,35 50,65" fill="white"></polygon>
          <polygon points="35,35 65,35 50,65" fill="white"></polygon>
        </mask>
      </defs>
    </svg>
    <div class="box"></div>
  </div>
</div>

/* ═══ چت‌بات ═══ */
const msgs=document.getElementById('msgs');
let botBusy=false,flow=null,chatOn=false;
const norm=s=>s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u0652\u0640]/g,'').replace(/\s+/g,' ').trim();
const YES=/^(اره|آره|بله|اوکی|هست|روشنه|فعاله|شد|درست شد|حل شد|اوهوم|یپ|اجره)/;
const NO=/^(نه|خاموشه|غیرفعاله|نیست|نشد|درست نشد|حل نشد|هنوز نه)/;
const NET_FLOW=[
 {q:'خب، بریم حلش کنیم 🔧 اول: پروکسی یا VPN روشنه؟ خیلی وقتا مقصر همینه.',
  y:'روشنه پس! خاموشش کن، مرورگر رو کامل ببند و دوباره باز کن. درست شد؟',
  n:'پس مشکل از سوکت شبکه‌ست. Win+R → cmd → این دستور: netsh winsock reset → Enter → ری‌استارت کن. بعدش نتیجه رو بگو!'},
 {q:'خب، شد؟ درست شد؟',
  y:'ایول! خوشحال شدم 😄 اگه بازم چیزی بود، همین‌جام.',
  n:'مرحلهٔ بعد — DNS رو دستی کن: تنظیمات آداپتور → IPv4 → DNS بذار 8.8.8.8 و 8.8.4.4. بعد توی cmd بزن: ipconfig /flushdns. این معمولاً آخرشه! نتیجه رو بگو.'}];
const INTENTS=[
 [/نت|اینترنت|وای ?فای|مودم|قطع|وصل نمی|باز نمی/,()=>{flow={step:0,done:false};botSay(NET_FLOW[0].q);}],
 [/هنگ|کند|دیر|فریز|کم میاد|سرعت|روشن نمی|بالا نمی/,()=>botSay('بریم سراغش: Ctrl+Shift+Esc → Task Manager → تب Startup → اضافی‌ها رو Disable کن. درایور گرافیک رو آپدیت کن. اگه داغ می‌کنه دمای CPU رو چک کن — بالای 90 درجه یعنی خاک گرفته! دقیق‌تر بگو چی می‌شه.')],
 [/گیم|بازی|لگ|پینگ|فریم|fps/,()=>botSay('گیمرید پس 😎 اول دانلودهای پس‌زمینه رو ببند، اگه می‌تونی کابل بزن (وای‌فای پینگ می‌ده!) و از تنظیمات بازی یه پله پایین بیا. اسم بازی رو بگو تا دقیق راهنماییت کنم.')],
 [/هوش مصنوعی|\bai\b|تصویر|موزیک|موسیقی|ویدیو|سناریو|اسکریپت/,()=>botSay('AI هم‌بازیِ منه! تصویر، موزیک، ویدیو، حتی سناریو و اسکریپت باهاش می‌سازم. بگو چی تو ذهنته — پرامپتِ درست و ابزارِ مناسبش رو بهت می‌گم.')],
 [/کریپتو|ارز|بیت ?کوین|تتر|سواپ|ترید|صرافی|والت|کیف پول/,()=>botSay('خرید، فروش و سواپ کار می‌کنم. ترید؟ صادقانه: آماتورم و در حال یادگیری — توصیهٔ معاملاتی نمی‌دم، ولی اصول و ابزارها رو با هم مرور می‌کنیم. سؤالت دقیقاً چیه؟')],
 [/سایت|وب ?سایت|کد|html|css|لندینگ/,()=>botSay('چهار سایت زنده دارم — تو بخش «پروژه‌ها» لینکشونه. خودت سایتی می‌خوای؟ ایده‌ات رو بگو، ساده و تمیز می‌سازیمش.')],
 [/فتوشاپ|ادیت|طراحی|پوستر|لوگو/,()=>botSay('فتوشاپ و ادیتِ موبایل کار می‌کنم. بگو چی می‌خوای بسازی — ساده‌ترین راهش رو می‌گم، بدون پیچوندن.')],
 [/کی هستی|خودتی|چند سالته|سنت|کجایی|کجا زندگی/,()=>botSay('حسام خاکبازم، 19 ساله از علی‌آباد کتول. دانشجوی مهندسی کامپیوتر. از 6 سالگی پشت کامپیوترم — اونم از نوع ذغالی‌ش! همه‌چیز رو خودم یاد گرفتم.')],
 [/کار|استخدام|همکاری|دورکاری|رزومه/,()=>botSay('برای پشتیبانی و ارتباط با مشتری — دورکاری یا حضوری در گلستان — آماده‌ام. پایین صفحه توی بخش «تماس» همهٔ راه‌ها هست.')],
 [/تماس|شماره|تلفن|ایمیل|تلگرام|واتساپ|اینستا/,()=>botSay('تلفن: 09114104923 — ایمیل: hesamkhakbaz5@gmail.com — تلگرام و واتساپ هم با همون شماره. پایین صفحه دکمه هم داره!')],
 [/مرسی|ممنون|لطف|دستت درد|قربون|دمت گرم/,()=>botSay('خواهش می‌کنم! همین که حل شد برام کافیه. کاری داشتی همین‌جام — تا نیمه‌شب بیدارم 🙂')],
 [/تنهایی|حالم|خسته|ناراحت|افسرده|شکست/,()=>botSay('شنیدم. گاهی فقط باید یکی گوش بده — من همین‌جام، هر وقت خواستی حرف بزن. و اگه یه کار فنی هم داری، بده دستم تا درگیریش کنیم؛ سرحوامت می‌ره 😊')],
 [/سلام|درود|هلو|هی\b|صبح بخیر|شب بخیر/,()=>botSay('سلام! خوش اومدی 🙌 بگو چه مشکلی داری — نت، سیستم، گیم، AI، کریپتو — با هم حلش می‌کنیم.')]];
const FALLBACK=[
 'نوشتی، خوندم 🙂 یه‌کم دقیق‌تر بگو تا سریع حلش کنیم — مثلاً دربارهٔ نت، هنگِ سیستم، گیم، AI یا کریپتو؟',
 'اوکی! قدم‌به‌قدم بریم. اول بگو مشکل روی چیه — گوشی، کامپیوتر، یا اینترنت؟',
 'هرچی هست حل‌شدنیه. ساده بگو: چی‌کار می‌کنی و کجا گیر می‌کنی؟'];
function add(t,w){const d=document.createElement('div');d.className='mb '+w;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function typing(){const d=document.createElement('div');d.className='mb m tp';d.innerHTML='<i></i><i></i><i></i>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function botSay(t,delay){botBusy=true;const tp=typing();setTimeout(()=>{tp.remove();add(t,'m');botBusy=false;if(flow&&flow.done)flow=null;},delay||700+Math.min(1200,t.length*14));}
function reply(raw){
 if(botBusy)return;
 const t=norm(raw);
 add(raw,'u');
 if(flow&&!flow.done){
  const st=NET_FLOW[flow.step];
  if(YES.test(t)){botSay(st.y);flow.step++;if(flow.step>=NET_FLOW.length)flow.done=true;}
  else if(NO.test(t)){botSay(st.n);flow.step++;if(flow.step>=NET_FLOW.length)flow.done=true;}
  else botSay('فقط آره یا نه جواب بده تا دقیق راهنماییت کنم 🙂');
  return;
 }
 for(const it of INTENTS){if(it[0].test(t)){it[1]();return;}}
 botSay(FALLBACK[Math.floor(Math.random()*FALLBACK.length)]);
}
document.getElementById('cform').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('cinput').value.trim();if(!v||botBusy)return;document.getElementById('cinput').value='';reply(v);});
document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)reply(c.textContent);});

 faq:{title:'سوالات متداول',items:[
  ['نت وصله ولی سایت‌ها باز نمی‌شن؟','اول چک کن <code>پروکسی یا VPN</code> روشن نباشه — بیشترِ وقتا مقصر همونه. بعد توی <code>cmd</code> بزن <code>netsh winsock reset</code> و ری‌استارت کن. نشد؟ DNS رو بذار <code>8.8.8.8</code> و بزن <code>ipconfig /flushdns</code>.'],

  document.querySelectorAll('#colorSquares .half-square').forEach(s=>s.classList.toggle('active',s.dataset.c===name));

 }

  document.getElementById('footerLinks').innerHTML=QUICK[lang].map(function(t,i){return '<li><a href="'+ANCHORS[i]+'">'+t+'</a></li>';}).join('');

 }

 function initFaq(){
  document.querySelectorAll('.faq-question').forEach(function(q){
   const n=q.cloneNode(true);
   q.parentNode.replaceChild(n,q);
   n.addEventListener('click',function(){
    const p=n.parentElement,act=p.classList.contains('active');
    document.querySelectorAll('.faq-item').forEach(function(i){i.classList.remove('active');});
    if(!act)p.classList.add('active');
   });
  });
 }

 function bindSmooth(){
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
   if(a.dataset.smooth)return;
   a.dataset.smooth='1';
   a.addEventListener('click',function(e){
    const target=document.querySelector(a.getAttribute('href'));
    if(!target)return;
    e.preventDefault();
    document.getElementById('navPopup').classList.remove('open');
    lenis.scrollTo(target,{duration:1.9,easing:function(t){return 1-Math.pow(1-t,4);},offset:0});
   });
  });
 }

 /* زبان → اسکلتون ۳ ثانیه */
 document.getElementById('langToggle').addEventListener('click',function(e){
  e.stopPropagation();
  if(cur==='fa')cur='en';else cur='fa';
  render(cur);
  openSwap();
 });

 /* منو */
 const menuStar=document.getElementById('menuStar'),navPopup=document.getElementById('navPopup');
 menuStar.addEventListener('click',function(e){e.stopPropagation();navPopup.classList.toggle('open');});
 document.addEventListener('click',function(e){
  if(!menuStar.contains(e.target)&&!navPopup.contains(e.target))navPopup.classList.remove('open');
 });

 /* GSAP */
 if(!isMobile()){
  gsap.to('#firstPageContent',{scrollTrigger:{trigger:'#page1',start:'top top',end:'bottom top',scrub:1.2},opacity:0,scale:.85,filter:'blur(8px)'});
  gsap.to('.page-first .top-thin-line,.page-first .squares-horizontal,.page-first .date-outside',{scrollTrigger:{trigger:'#page1',start:'top top',end:'bottom top',scrub:1},opacity:0,y:-30});
  gsap.to('#fallContainer',{scrollTrigger:{trigger:'#page2',start:'top top',end:'bottom top',scrub:1.2},y:300,opacity:0,scale:.7,rotation:12});
  gsap.to('#suckLayer',{scrollTrigger:{trigger:'#page3',start:'top top',end:'bottom top',scrub:1.2},scale:300});
  const reveal=function(sel,trg,x,y){
   gsap.set(sel,{opacity:0,x:x||0,y:(y===undefined)?100:y});
   ScrollTrigger.create({trigger:trg,start:'top 70%',
    onEnter:function(){gsap.to(sel,{opacity:1,x:0,y:0,duration:.8,ease:'back.out(.6)'});},
    onLeaveBack:function(){gsap.set(sel,{opacity:0,x:x||0,y:(y===undefined)?100:y});}
   });
  };
  reveal('#aboutCard','#page2');
  reveal('#aboutDetailContainer','#page3');
  reveal('#iranMapCard','#page3',50,0);
  reveal('#page4 .skills-container','#page4',0,50);
  reveal('#projectsContainer','#page5');
  reveal('#faqContainer','#page6');
  reveal('.chat-info','#chat',0,60);
  reveal('#devWrap','#chat',0,60);
  reveal('#contactCard','#page7',0,60);
  gsap.set('.contact-header-outside',{opacity:0,y:30});
  ScrollTrigger.create({trigger:'#page7',start:'top 70%',
   onEnter:function(){gsap.to('.contact-header-outside',{opacity:1,y:0,duration:.8});},
   onLeaveBack:function(){gsap.set('.contact-header-outside',{opacity:0,y:30});}
  });
 }else{
  const st=document.createElement('style');
  st.textContent='.about-card,.about-detail-container,.map-card,.skills-container,.projects-container,.faq-container,.contact-glass-card,.contact-header-outside,.chat-info,#devWrap{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}.visible{opacity:1!important;transform:none!important}';
  document.head.appendChild(st);
  const obs=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)en.target.classList.add('visible');});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  ['.about-card','.about-detail-container','.map-card','.skills-container','.projects-container','.faq-container','.contact-glass-card','.contact-header-outside','.chat-info','#devWrap'].forEach(function(s){
   document.querySelectorAll(s).forEach(function(el){obs.observe(el);});
  });
  gsap.to('#firstPageContent',{scrollTrigger:{trigger:'#page1',start:'top top',end:'bottom top',scrub:.3},opacity:.85,scale:.97});
 }

 function animateBars(){
  document.querySelectorAll('.progress-fill').forEach(function(b){const p=b.dataset.percent;if(p)b.style.width=p+'%';});
  document.querySelectorAll('.bar-fill').forEach(function(b){const h=b.dataset.height;if(h)b.style.height=h+'%';});
 }
 ScrollTrigger.create({trigger:'#page4',start:'top 60%',onEnter:animateBars,onEnterBack:animateBars});

 /* پین محصولی */
 const ssWrap=document.getElementById('ss11');
 const ssFrames=document.querySelectorAll('.ss11-frame');
 const ssDots=document.querySelectorAll('#ssDots i');
 const ssNum=document.getElementById('ssNum');
 const FN=ssFrames.length;
 function updSS(){
  const r=ssWrap.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight)return;
  const total=ssWrap.offsetHeight-innerHeight;
  const p=Math.max(0,Math.min(1,-r.top/total));
  const pos=p*(FN-1);
  ssFrames.forEach(function(f,i){
   const d=pos-i,ad=Math.abs(d);
   f.style.opacity=Math.max(0,1-ad*1.5).toFixed(3);
   f.style.transform='translateY('+(d*-26).toFixed(1)+'px) scale('+(1-ad*.05).toFixed(4)+')';
   f.style.filter='blur('+(ad*5).toFixed(2)+'px)';
  });
  const act=Math.min(FN-1,Math.round(pos));
  ssDots.forEach(function(dt,i){dt.classList.toggle('on',i===act);});
  ssNum.textContent=(act+1)+' / '+FN;
 }
 addEventListener('scroll',updSS,{passive:true});
 updSS();

 /* تیلت گوشی */
 const chatSec=document.getElementById('chat'),dev=document.getElementById('devWrap');
 let dnx=0,dny=0,dcx=0,dcy=0;
 chatSec.addEventListener('pointermove',function(e){
  const r=chatSec.getBoundingClientRect();
  dnx=((e.clientX-r.left)/r.width-.5)*2;
  dny=((e.clientY-r.top)/r.height-.5)*2;
 });
 chatSec.addEventListener('pointerleave',function(){dnx=0;dny=0;});
 gsap.ticker.add(function(){
  if(isMobile())return;
  dcx+=(dnx-dcx)*.08;
  dcy+=(dny-dcy)*.08;
  dev.style.transform='rotateY('+(dcx*13).toFixed(2)+'deg) rotateX('+(-dcy*8).toFixed(2)+'deg)';
 });

 new IntersectionObserver(function(es,io){
  es.forEach(function(en){
   if(en.isIntersecting&&!chatOn){chatOn=true;botSay(L[cur].chat.welcome,600);io.disconnect();}
  });
 },{threshold:.4}).observe(document.getElementById('chat'));

 window.addEventListener('resize',function(){
  lenis.resize();
  ScrollTrigger.refresh();
 });

 document.addEventListener('contextmenu',function(e){e.preventDefault();});
 document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&['c','v','x','u','s','p','a'].indexOf(e.key.toLowerCase())>-1)e.preventDefault();
  if(e.key==='F12')e.preventDefault();
  if(e.ctrlKey&&e.shiftKey&&['I','J','C'].indexOf(e.key)>-1)e.preventDefault();
 });
 ['dragstart','selectstart','copy','cut','paste'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();});});

 render('en');
});
